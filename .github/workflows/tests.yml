# V.O.I.D tests. Hermetic: no network, no real keyring, no microphone, no model download
# (tests/conftest.py enforces this; see tests/test_isolation.py).
#
# The first real run of this workflow (2026-10-19) failed at COLLECTION, for a reason that had
# nothing to do with the suite: it installed `requirements.lock` only, and the lock does not carry
# the MCP SDK - so `tests/test_mcp_server.py` could not import `mcp` and pytest aborted the whole
# run. The optional manifests the suite's own tests import are therefore installed too, below. The
# pinned CPython (3.14) resolved fine on windows-latest.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install the pinned environment
        run: python -m pip install -r requirements.lock
      # The optional capability layers. Each has tests that IMPORT it, and
      # tests/test_v3_interop.py asserts the installed version equals the pinned one - so a run
      # without these does not "skip those tests", it fails to collect at all.
      - name: Install the optional capability layers
        run: |
          python -m pip install -r requirements-mcp.txt
          python -m pip install -r requirements/v3-capabilities.txt
          python -m pip install -r requirements/v3-interop.txt
      - name: Run the suite
        run: python -m pytest -q --junitxml=junit.xml
      - name: Guard against silent coverage loss
        run: python scripts/check_test_guard.py --junit junit.xml
      # "Done means preflight passed." The hermetic suite proves the units; this proves the chains
      # are wired together in a fresh checkout. --offline because a runner has no credential and
      # --strict is deliberately NOT used: an absent optional layer is a warning, not a failure.
      - name: Preflight the live chains
        run: python -m void preflight --offline
