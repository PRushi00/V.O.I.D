# V.O.I.D tests. Hermetic: no network, no real keyring, no microphone, no model download
# (tests/conftest.py enforces this; see tests/test_isolation.py).
#
# UNVALIDATED: this workflow has not run on GitHub yet. The runner's availability of the
# pinned CPython (3.14) is the main thing to check on the first run.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install the pinned environment
        run: python -m pip install -r requirements.lock
      - name: Run the suite
        run: python -m pytest -q --junitxml=junit.xml
      - name: Guard against silent coverage loss
        run: python scripts/check_test_guard.py --junit junit.xml
